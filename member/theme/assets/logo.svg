<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Global Exchange">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#F0D060"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" stroke="url(#gold)" stroke-width="3" opacity="0.85"/>
  <circle cx="100" cy="100" r="84" stroke="url(#silver)" stroke-width="1.2" opacity="0.45"/>
  <!-- Stylized G -->
  <path d="M148 100c0-26.5-21.5-48-48-48s-48 21.5-48 48 21.5 48 48 48c14.2 0 27-6.2 35.7-16.1" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M148 100H112" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <!-- Stylized E overlay -->
  <path d="M118 72h28M118 100h34M118 128h28" stroke="url(#silver)" stroke-width="10" stroke-linecap="round"/>
  <!-- Up arrow / growth -->
  <path d="M72 128l12-22 10 12 18-34" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M104 84h12v12" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Globe dots in G curve -->
  <circle cx="68" cy="118" r="2.2" fill="#D4AF37" opacity="0.9"/>
  <circle cx="62" cy="105" r="1.8" fill="#D4AF37" opacity="0.7"/>
  <circle cx="66" cy="92" r="1.6" fill="#D4AF37" opacity="0.6"/>
  <circle cx="74" cy="82" r="1.5" fill="#D4AF37" opacity="0.5"/>
</svg>
