<html>
    <head>
        <title>Web3</title>
        <!-- <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script> -->
        <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js@1.0.0-beta.34/dist/web3.min.js"></script>
        <script src="index.js"></script>
    </head>

    <body class="container">
        <h1>Get Wallet Balances</h1>
    
        <button onclick="getUserEtherBalance()">Get User Ether balance</button>
        <span id="ethBalance"></span> in Ether.

        <button onclick="getContractEtherBalance()">Get Contract Ether balance</button>
        <span id="ethBalance"></span> in Ether.

        <button onclick="getContractUSDTBalance()">Get Contract USDT balance</button>
        <span id="usdtBalance"></span> in Ether.
        <hr/>
    
        <h1>Interact with a contract</h1>
    
    
    <!-- <button onclick="getPreviouslyDeployedContract()">Attach to existing contract</button> -->
    
    <button onclick="getAccounts()">Get Accounts</button>
    <button onclick="approveContract()">Approve 1 USDT to Miraz Contract</button>
    <button onclick="transferToken()">Pay 1 USDT to Miraz Contract</button>
    <button onclick="withdrawToken()">Withdraw 1 USDT from Miraz Contract</button>
    <button onclick="withdrawTokenByOwner()">Withdraw 10 USDT (only Owner)</button>
    <button onclick="transferEth()">Pay min .01 ethers to verify your address</button>
    <button onclick="withdrawEth()">Withdraw .01 Ethers</button>
    <button onclick="withdrawEthByOwner()">Withdraw All Ethers (only allowed by Owner)</button>
    <button onclick="getUSDTBalance()">Get user USDT balance</button>
    <button onclick="getContractEtherBalance()">Get contract ether balance</button>
    <button onclick="getTransactionEvents()">Filter Events Get</button>

    <br>
    <br>
    
    Counter Value for current contract: <span id="myCounter"></span>
    
    <br />
    <br />
    <h2>Events:</h2>
    <div id="events"></div>
    </body>
</html>
